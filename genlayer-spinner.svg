<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" role="img" aria-label="Loading">
  <!-- GenLayer Spinner — "Converging Minds"
       Three static nodes at the vertices of an equilateral triangle (the
       GenLayer Δ mark), sitting on a faint orbit ring. A single Kinetic
       Cobalt arc sweeps the ring continuously — the validator poll that
       closes into consensus, looping forever. -->

  <!-- faint orbit ring -->
  <circle cx="20" cy="20" r="15" fill="none" stroke="#110FFF" stroke-opacity="0.16" stroke-width="2" />

  <!-- three static nodes, triangle vertices (Δ orientation) -->
  <circle cx="20" cy="5" r="2.3" fill="#110FFF" />
  <circle cx="32.99" cy="27.5" r="2.3" fill="#110FFF" />
  <circle cx="7.01" cy="27.5" r="2.3" fill="#110FFF" />

  <!-- rotating consensus arc -->
  <circle
    cx="20" cy="20" r="15"
    fill="none"
    stroke="#110FFF"
    stroke-width="3"
    stroke-linecap="round"
    stroke-dasharray="23.56 70.69"
  >
    <animateTransform
      attributeName="transform"
      type="rotate"
      from="0 20 20"
      to="360 20 20"
      dur="1.1s"
      repeatCount="indefinite"
    />
  </circle>
</svg>
