     width/height on .gl-spinner; recolor via --gl-spinner-color. -->

  <circle class="gl-spinner__node" cx="20" cy="5" r="2.3" />

  <circle class="gl-spinner__node" cx="7.01" cy="27.5" r="2.3" />

  <circle class="gl-spinner__arc" cx="20" cy="20" r="15" />
